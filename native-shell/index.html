<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>First Week</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0f; color: #f4f4f5; font-family: -apple-system, system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -0.02em; }
    p { margin: 0; color: #a1a1aa; max-width: 320px; line-height: 1.4; }
    button { margin-top: 8px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: #fff; color: #000; font-weight: 800; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>First Week</h1>
    <p>Draft an album, drop it, and see your first-week sales. You need a connection to play.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
