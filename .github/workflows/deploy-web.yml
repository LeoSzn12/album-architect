name: Deploy First Week web game

# Puts the First Week web game live as the Cloudflare Worker "first-week".
# Needs one repository secret, CLOUDFLARE_API_TOKEN, made from Cloudflare's
# "Edit Cloudflare Workers" token template. Nothing deploys without it.
on:
  push:
    branches: [claude/project-thread-wexxks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-week-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require the Cloudflare token
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Save a Cloudflare API token as the repository secret CLOUDFLARE_API_TOKEN first.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config dist/server/wrangler.json --name first-week | tee "$RUNNER_TEMP/deploy.log"
      - name: Check the live game answers
        run: |
          URL="$(grep -oE 'https://first-week\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          if [[ -z "$URL" ]]; then echo 'No workers.dev link in the deploy output.'; exit 0; fi
          echo "Live link: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "$URL/"; then echo "Home page answers."; exit 0; fi
            sleep 10
          done
          echo 'The game home page did not answer.'; exit 1
